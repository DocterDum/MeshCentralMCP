[package]
name = "meshcentral-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "elicitation"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.20"
